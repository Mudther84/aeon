server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: projects-service
              uri: ${PROJECTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/projects/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
