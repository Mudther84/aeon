server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:formflora}
    password: ${MYSQL_PASSWORD:formflora_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
security:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
